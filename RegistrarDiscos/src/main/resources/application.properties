spring.application.name=RegistrarDiscos

spring.datasource.url=jdbc:postgresql://postgresql-diego1.alwaysdata.net:5432/diego1_discos
spring.datasource.username=diego1
spring.datasource.password=duocuc123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
