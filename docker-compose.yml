services:
  mysql:
    image: mysql:8.0
    container_name: tiendadiscos-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tiendadiscos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiendadiscos-net

  administracion-usuario:
    build:
      context: .
      dockerfile: AdministracionUsuario/Dockerfile
    container_name: tiendadiscos-usuario
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tiendadiscos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_TABLE: flyway_schema_history_usuarios
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: 0
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiendadiscos-net

  administracion-envios:
    build:
      context: .
      dockerfile: AdministracionEnvios/Dockerfile
    container_name: tiendadiscos-envios
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tiendadiscos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_TABLE: flyway_schema_history_envios
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: 0
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiendadiscos-net

  registrar-productos:
